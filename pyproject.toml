[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fastfuncsim"
version = "0.1.0"
description = "Fast GPU-accelerated functional MRI simulation and GLM fitting"
readme = "README.md"
authors = [{name = "FastFuncSim Developers"}]
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.23",
    "torch>=2.0",
    "nibabel>=5.1",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "tqdm>=4.65",
    "h5py>=3.8",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0",
    "scikit-learn>=1.2",
]

[project.scripts]
ffs_nwarp = "fastfuncsim.processing.nwarpforge_cli:main"
ffs_allineate = "fastfuncsim.processing.allineate_cli:main"
ffs_moco = "fastfuncsim.processing.ffs_moco_cli:main"
ffs_qwarp = "fastfuncsim.processing.cli:main"
ffs_motsim = "fastfuncsim.processing.ffs_motsim:main"
ffs_util_pcwarp = "fastfuncsim.processing.pcwarp_cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["fastfuncsim*"]
exclude = ["tests*", "examples*"]

[tool.ty.environment]
python-version = "3.12"

[tool.ty.rules]
# Real bugs — keep as errors
unresolved-reference = "error"
unresolved-import = "error"
missing-argument = "error"
call-non-callable = "error"
not-iterable = "error"
invalid-raise = "error"
invalid-exception-caught = "error"
division-by-zero = "error"

# Too noisy with torch/numpy stubs — silence
invalid-argument-type = "ignore"
not-subscriptable = "ignore"
invalid-assignment = "ignore"
unsupported-operator = "ignore"
no-matching-overload = "ignore"
invalid-parameter-default = "ignore"

# Too noisy with torch/numpy — silence
possibly-missing-attribute = "ignore"
redundant-cast = "ignore"

# Useful but noisy — warn only
unresolved-attribute = "warn"
invalid-return-type = "warn"
unknown-argument = "warn"

[tool.ty.src]
include = ["fastfuncsim"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Enable important error detection
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes (undefined names, imports, etc)
    "I",    # isort (import ordering)
    "N",    # pep8-naming
    "UP",   # pyupgrade (modernize python code)
    "B",    # flake8-bugbear (likely bugs)
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "E731",  # lambda assignment (sometimes useful)
    "B008",  # function calls in argument defaults (common in ML)
    "N806",  # non-lowercase variable names (linear algebra conventions: XtX, P_nuisance, etc.)
    "N803",  # non-lowercase argument names (linear algebra conventions)
    "N802",  # function names should be lowercase (scientific conventions)
    "N811",  # constant imported as non-constant (numpy/torch aliases)
    "N812",  # lowercase imported as non-lowercase (numpy/torch aliases)
    "E741",  # ambiguous variable name (l, O, I — common in math/LA code)
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # Allow unused imports in __init__
"examples/*.py" = ["B007", "E402"]  # Allow unused loop vars, late imports
"notebooks/*.ipynb" = ["E702", "F841", "B007"]  # Allow semicolons, unused vars, unused loop vars in notebooks
"bin/*.py" = ["E402"]  # Allow late imports in CLI scripts (sys.path manipulation)
"tests/*.py" = ["B023", "E402"]  # Allow function definition in loop, late imports
"debug_*.py" = ["E402"]  # Allow late imports in debug scripts
