[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fastfuncstuff"
version = "0.1.0"
description = "Fast GPU-accelerated utilities functional MRI simulation and GLM fitting"
readme = "README.md"
license = "MIT"
authors = [{name = "Logan Dowdle"}]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.23",
    "torch>=2.0",
    "nibabel>=5.1",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "tqdm>=4.65",
    "h5py>=3.8",
    "pyyaml>=6.0",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0",
    "scikit-learn>=1.2",
]
dev = [
    "pytest>=7.0",
    "scikit-learn>=1.2",
    "ruff>=0.9",
]

[project.scripts]
# Analysis tools
ffs_build_design = "fastfuncstuff.cli.build_design:main"
ffs_decompose = "fastfuncstuff.cli.decompose:main"
ffs_deconvolve = "fastfuncstuff.cli.deconvolve:main"
ffs_denoise = "fastfuncstuff.cli.denoise:main"
ffs_denoisatorial = "fastfuncstuff.cli.denoisatorial:main"
ffs_hrfopt = "fastfuncstuff.cli.hrfopt:main"
ffs_librarian = "fastfuncstuff.cli.librarian:main"
ffs_ica = "fastfuncstuff.cli.ica:main"
ffs_nordic = "fastfuncstuff.cli.nordic:main"
ffs_pathfinder = "fastfuncstuff.cli.pathfinder:main"
ffs_phasereg = "fastfuncstuff.cli.phasereg:main"
ffs_sauna = "fastfuncstuff.cli.sauna:main"
ffs_reml = "fastfuncstuff.cli.reml:main"
ffs_ridge = "fastfuncstuff.cli.ridge:main"
ffs_tps = "fastfuncstuff.cli.tps:main"
ffs_xval_r2 = "fastfuncstuff.cli.xval_r2:main"
# Image processing tools
ffs_allineate = "fastfuncstuff.cli.allineate:main"
ffs_moco = "fastfuncstuff.cli.moco:main"
ffs_motsim = "fastfuncstuff.cli.motsim:main"
ffs_nwarp = "fastfuncstuff.cli.nwarp:main"
ffs_qwarp = "fastfuncstuff.cli.qwarp:main"
ffs_slicetime = "fastfuncstuff.cli.slicetime:main"
ffs_util_automask = "fastfuncstuff.cli.automask:main"
ffs_util_pcwarp = "fastfuncstuff.cli.pcwarp:main"
# Stats / utility tools
ffs_spatial_xcorr = "fastfuncstuff.cli.spatial_xcorr:main"
# Benchmark / testing
ffs_benchmark = "fastfuncstuff.cli.benchmark:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["fastfuncstuff*"]
exclude = ["tests*", "examples*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
norecursedirs = [".git", ".tox", "dist", "build", "*.egg", "examples"]

[tool.coverage.run]
source = ["fastfuncstuff"]
omit = [
    "fastfuncstuff/benchmark/*",
    "fastfuncstuff/cli/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.",
    "if TYPE_CHECKING:",
]

[tool.ty.environment]
python-version = "3.12"

[tool.ty.rules]
# Real bugs — keep as errors
unresolved-reference = "error"
unresolved-import = "error"
missing-argument = "error"
call-non-callable = "error"
not-iterable = "error"
invalid-raise = "error"
invalid-exception-caught = "error"
division-by-zero = "error"

# Too noisy with torch/numpy stubs — silence
invalid-argument-type = "ignore"
not-subscriptable = "ignore"
invalid-assignment = "ignore"
unsupported-operator = "ignore"
no-matching-overload = "ignore"
invalid-parameter-default = "ignore"

# Too noisy with torch/numpy — silence
possibly-missing-attribute = "ignore"
redundant-cast = "ignore"

# Useful but noisy — warn only
unresolved-attribute = "warn"
invalid-return-type = "warn"
unknown-argument = "warn"

[tool.ty.src]
include = ["fastfuncstuff"]

# psutil is an optional runtime dep imported inside try/except; not in .venv but in the conda env
[[tool.ty.overrides]]
include = ["fastfuncstuff/cli/reml.py", "fastfuncstuff/memory.py", "fastfuncstuff/glm/arma.py", "fastfuncstuff/benchmark/arch.py"]

[tool.ty.overrides.rules]
unresolved-import = "warn"

# division-by-zero in benchmark code is guarded at runtime (if ffs > 0 and ref > 0)
[[tool.ty.overrides]]
include = ["fastfuncstuff/benchmark/**"]

[tool.ty.overrides.rules]
division-by-zero = "warn"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Enable important error detection
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes (undefined names, imports, etc)
    "I",    # isort (import ordering)
    "N",    # pep8-naming
    "UP",   # pyupgrade (modernize python code)
    "B",    # flake8-bugbear (likely bugs)
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "E731",  # lambda assignment (sometimes useful)
    "B008",  # function calls in argument defaults (common in ML)
    "N806",  # non-lowercase variable names (linear algebra conventions: XtX, P_nuisance, etc.)
    "N803",  # non-lowercase argument names (linear algebra conventions)
    "N802",  # function names should be lowercase (scientific conventions)
    "N811",  # constant imported as non-constant (numpy/torch aliases)
    "N812",  # lowercase imported as non-lowercase (numpy/torch aliases)
    "E741",  # ambiguous variable name (l, O, I — common in math/LA code)
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # Allow unused imports in __init__
"examples/*.py" = ["B007", "E402"]  # Allow unused loop vars, late imports
"notebooks/*.ipynb" = ["E702", "F841", "B007"]  # Allow semicolons, unused vars, unused loop vars in notebooks
"bin/*.py" = ["E402"]  # Allow late imports in thin wrapper scripts
"fastfuncstuff/cli/*.py" = ["E402"]  # Allow late imports in CLI scripts
"tests/*.py" = ["B023", "E402"]  # Allow function definition in loop, late imports
