[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fastfuncsim"
version = "0.1.0"
description = "Fast GPU-accelerated functional MRI simulation and GLM fitting"
authors = [{name = "FastFuncSim Developers"}]
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.23",
    "torch>=2.0",
    "nibabel>=5.1",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "tqdm>=4.65",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["fastfuncsim*"]
exclude = ["tests*", "examples*"]

[tool.pyright]
include = ["fastfuncsim", "examples"]
exclude = ["**/node_modules", "**/__pycache__", ".git"]
typeCheckingMode = "basic"
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false
pythonVersion = "3.9"
pythonPlatform = "All"

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_optional = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Enable important error detection
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes (undefined names, imports, etc)
    "I",    # isort (import ordering)
    "N",    # pep8-naming
    "UP",   # pyupgrade (modernize python code)
    "B",    # flake8-bugbear (likely bugs)
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "E731",  # lambda assignment (sometimes useful)
    "B008",  # function calls in argument defaults (common in ML)
    "N806",  # non-lowercase variable names (linear algebra conventions: XtX, P_nuisance, etc.)
    "N803",  # non-lowercase argument names (linear algebra conventions)
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # Allow unused imports in __init__
"examples/*.py" = ["B007"]  # Allow unused loop variables in examples
