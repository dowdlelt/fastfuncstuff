# Benchmark config for OpenNeuro ds003427 (sub-03, checkerboard GE)
#
# This config is used ONLY for the phasereg stage. The phasereg benchmark
# compares ffs_phasereg against phaseprep's PhaseFitOdr (scipy.odr reference).
#
# Fetch with ffs_benchmark -download. The stage prepares and masks the
# motion-corrected magnitude and unwrapped phase before timing either fit.

dataset_id: ds003427
subject: "03"
session: "01"

download:
  data_dir_name: ds003427-download
  s3_url: s3://openneuro.org/ds003427
  include:
    - "*sub-03_task-checkerboard_acq-ge_run-01_*.nii.gz"

tasks:
  checkerboard:
    runs: [1]

stages:
  - phasereg

stage_params:
  phasereg:
    acquisition: ge
    polort: 1
    ref_n_workers: 8
    ref_use_automask: true
    task_removal: none
    phase_filter: none
    regression: deming
