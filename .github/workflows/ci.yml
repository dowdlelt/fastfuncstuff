name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Import smoke test
        run: |
          python -c "import fastfuncsim as ffs; print('fastfuncsim import OK:', bool(getattr(ffs, '__file__', None)))"

      - name: Run focused tests
        run: |
          pytest -q tests/test_glm_outputs.py tests/test_timing_utils.py tests/test_glm_core.py
